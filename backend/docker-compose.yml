version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ocean_math_postgres
    restart: always
    environment:
      POSTGRES_DB: ocean_math_db
      POSTGRES_USER: ocean_admin
      POSTGRES_PASSWORD: ocean_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ocean_math_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: ocean_math_api
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./ocean_math:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=ocean-math-super-secret-key-production-grade
      - DATABASE_URL=postgres://ocean_admin:ocean_secure_password@db:5432/ocean_math_db
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db
      - redis

  celery_worker:
    build: .
    container_name: ocean_math_celery
    restart: always
    command: celery -A ocean_math worker -l info
    volumes:
      - ./ocean_math:/app
    environment:
      - DEBUG=1
      - DATABASE_URL=postgres://ocean_admin:ocean_secure_password@db:5432/ocean_math_db
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
